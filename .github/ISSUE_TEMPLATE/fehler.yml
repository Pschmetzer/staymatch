name: Fehler
description: Etwas in Viertel-Finder oder Plugin funktioniert nicht richtig.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Wo?
      options: [Viertel-Finder (Web), Plugin, Landingpage, Anderes]
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: "1. Stadt Barcelona eingeben\n2. …"
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Erwartet / tatsächlich
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Browser und Gerät
      placeholder: Chrome 130, Windows 11
  - type: markdown
    attributes:
      value: Bitte keine persönlichen Daten (Namen der Gruppe, Adressen, Reisedaten) eintragen.
