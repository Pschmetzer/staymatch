name: Idee
description: Ein Vorschlag für StayMatch. Vorher kurz in IDEEN.md schauen, ob es ihn schon gibt.
labels: [idee]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem löst das?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Dein Vorschlag
    validations: { required: true }
  - type: textarea
    id: alt
    attributes:
      label: Alternativen (optional)
