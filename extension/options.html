<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>StayMatch: Import</title>
<style>
body{max-width:560px;margin:24px auto;padding:0 16px;font:14px/1.5 system-ui;color:#1d1d1f;background:#fff}
h1{font-size:18px} h1 span{color:#e0475b} .muted{color:#6b6b70;font-size:12px}
button,input{font:inherit} button{padding:6px 12px;border:1px solid #ccc;border-radius:8px;background:none;color:inherit;cursor:pointer}

<body>
<h1>Stay<span>Match</span> · Merkliste importieren</h1>
<p class="muted">Wähle eine Datei, die du mit „JSON“ im StayMatch-Popup gesichert hast. Vorhandene Unterkünfte werden zusammengeführt: Notiz, Stimme und Besuche gehen nicht verloren, der neuere Stand gewinnt. Alles bleibt in diesem Browser.</p>
<p><input type="file" id="file" accept="application/json,.json" aria-label="Datei wählen"></p>
<div id="out" role="status" aria-live="polite"></div>
<script src="core.js"></script>
<script src="import.js"></script>
<script src="options.js"></script>
