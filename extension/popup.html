<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
body{width:340px;margin:0;font:13px/1.4 system-ui;color:#1d1d1f;background:#fff}
header{padding:12px 14px;border-bottom:1px solid #eee} h1{font-size:16px;margin:0} h1 span{color:#e0475b}
nav{display:flex;border-bottom:1px solid #eee} nav button{color:inherit;flex:1;border:0;background:none;padding:8px;cursor:pointer;font:inherit} nav button.on{border-bottom:2px solid #e0475b;font-weight:600}
#list{max-height:380px;overflow:auto} .item{display:flex;gap:8px;padding:8px 14px;border-bottom:1px solid #f2f2f2;text-decoration:none;color:inherit}
.muted{color:#6b6b70;font-size:12px}
#trip{padding:8px 14px;font-size:12px;border-bottom:1px solid #eee}
.score{float:right;font-weight:700}.warn{color:#9a5b00}#search{box-sizing:border-box;width:calc(100% - 28px);margin:6px 14px;padding:5px 8px;font:inherit}#search[hidden]{display:none}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #e0475b;outline-offset:2px}
@media (prefers-color-scheme: dark){body{background:#1e1e22;color:#f2f2f4}.muted{color:#a0a0a8}.warn{color:#e0a040}select,input[type=search]{background:#26262b;color:inherit;border:1px solid #34343a}#opts{border-color:#34343a!important}#profile{background:#26262b!important}header,nav,.item,#trip{border-color:#34343a!important}}
#profile{padding:10px 14px;background:#faf8f5;font-size:12px} footer{padding:8px 14px;display:flex;justify-content:space-between}
footer a,footer button{font-size:12px;color:#e0475b;background:none;border:0;cursor:pointer;padding:0}
</style></head>
<body>
<header><h1>Stay<span>Match</span></h1><div class="muted">Lokal gespeichert, verlässt deinen Browser nicht.</div></header>
<div id="profile"></div>
<div id="trip"></div>
<nav role="tablist" aria-label="Ansicht"><button role="tab" id="tab-top" aria-selected="true" aria-controls="list" data-tab="top" class="on">Empfehlungen</button><button role="tab" id="tab-all" aria-selected="false" aria-controls="list" tabindex="-1" data-tab="all">Verlauf</button><button role="tab" id="tab-liked" aria-selected="false" aria-controls="list" tabindex="-1" data-tab="liked">Gefällt mir</button><button role="tab" id="tab-disliked" aria-selected="false" aria-controls="list" tabindex="-1" data-tab="disliked">Nein</button></nav>
<input type="search" id="search" placeholder="Suchen (Titel, Ort, Notiz)" aria-label="Verlauf durchsuchen" hidden>
<div id="list" role="tabpanel" aria-labelledby="tab-top" tabindex="0"></div>
<div id="opts" style="padding:6px 14px;font-size:12px;border-top:1px solid #eee">
<label style="display:block"><input type="checkbox" id="optBadges" checked> Punkte an den Airbnb-Karten anzeigen</label>
<label style="display:block;margin-top:4px">Panel-Design: <select id="optTheme"><option value="auto">automatisch</option><option value="light">hell</option><option value="dark">dunkel</option></select></label>
<button id="share" style="margin-top:6px;font-size:12px;color:#e0475b;background:none;border:0;cursor:pointer;padding:0">Merkliste kopieren</button>
</div>
<footer><a id="app" target="_blank">Viertel-Finder öffnen</a><span><button id="csv">CSV</button> · <button id="export">JSON</button> · <button id="import">Import</button> · <button id="wipe">Löschen…</button></span></footer>
<input type="file" id="file" accept="application/json" hidden>
<script src="core.js"></script>
<script src="rank.js"></script>
<script src="popup.js"></script>
</body></html>
