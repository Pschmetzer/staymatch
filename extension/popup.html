<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
body{width:340px;margin:0;font:13px/1.4 system-ui;color:#1d1d1f;background:#fff}
header{padding:12px 14px;border-bottom:1px solid #eee} h1{font-size:16px;margin:0} h1 span{color:#e0475b}
nav{display:flex;border-bottom:1px solid #eee} nav button{color:inherit;flex:1;border:0;background:none;padding:8px;cursor:pointer;font:inherit} nav button.on{border-bottom:2px solid #e0475b;font-weight:600}
#list{max-height:380px;overflow:auto} .item{display:flex;gap:8px;padding:8px 14px;border-bottom:1px solid #f2f2f2;text-decoration:none;color:inherit}
.item img{width:52px;height:52px;object-fit:cover;border-radius:6px;background:#eee} .muted{color:#888;font-size:12px}
#trip{padding:8px 14px;font-size:12px;border-bottom:1px solid #eee}
.score{float:right;font-weight:700}.warn{color:#b86e00}
@media (prefers-color-scheme: dark){body{background:#1e1e22;color:#f2f2f4}#profile{background:#26262b!important}header,nav,.item,#trip{border-color:#34343a!important}}
#profile{padding:10px 14px;background:#faf8f5;font-size:12px} footer{padding:8px 14px;display:flex;justify-content:space-between}
footer a,footer button{font-size:12px;color:#e0475b;background:none;border:0;cursor:pointer;padding:0}
</style></head>
<body>
<header><h1>Stay<span>Match</span></h1><div class="muted">Lokal gespeichert, verlässt deinen Browser nicht.</div></header>
<div id="profile"></div>
<div id="trip"></div>
<nav role="tablist"><button role="tab" data-tab="top" class="on">Empfehlungen</button><button role="tab" data-tab="all">Verlauf</button><button role="tab" data-tab="liked">Gefällt mir</button><button role="tab" data-tab="disliked">Nein</button></nav>
<div id="list"></div>
<footer><a id="app" target="_blank">Viertel-Finder öffnen</a><span><button id="csv">CSV</button> · <button id="export">JSON</button> · <button id="import">Import</button> · <button id="wipe">Alles löschen</button></span></footer>
<input type="file" id="file" accept="application/json" hidden>
<script src="popup.js"></script>
</body></html>
